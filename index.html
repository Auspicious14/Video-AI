<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VideoAI Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#09090b;--surface:#18181b;--border:#27272a;--ink:#fafafa;--muted:#a1a1aa;--acc:#6366f1;--acc2:#818cf8;--ok:#22c55e;--warn:#f59e0b;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);padding:24px;line-height:1.5}
.container{max-width:1040px;margin:0 auto}
h1{font-weight:700;font-size:32px;margin-bottom:8px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.tabs{display:flex;gap:8px;margin-bottom:24px;background:var(--surface);padding:6px;border-radius:var(--r);border:1px solid var(--border);overflow-x:auto}
.tab{padding:8px 16px;border-radius:8px;border:none;background:0 0;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500;transition:.2s}
.tab.active{background:var(--acc);color:#fff}
.panel{display:none;background:var(--surface);padding:32px;border-radius:var(--r);border:1px solid var(--border)}
.panel.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);padding:12px;border-radius:8px;color:var(--ink);font-family:inherit;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
.btn{background:var(--acc);color:#fff;border:none;padding:14px 24px;border-radius:8px;font-weight:600;cursor:pointer;width:100%;transition:.2s;font-size:15px}
.btn:hover{background:var(--acc2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:rgba(255,255,255,.06);border:1px solid var(--border)}
.btn.secondary:hover{background:rgba(255,255,255,.10)}
.tog{display:flex;align-items:center;gap:12px;cursor:pointer}
.tog input{width:auto}
/* Progress */
.progress{margin-top:24px;padding:24px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r);display:none}
.progress.show{display:block}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.step.active{color:var(--acc2);font-weight:600}
.step.done{color:#22c55e}
.pbar{height:6px;background:var(--border);border-radius:4px;margin:16px 0;overflow:hidden}
.pfill{height:100%;background:var(--acc);width:0%;transition:width .3s}
.eta{font-size:12px;color:var(--muted);margin-top:8px}
.result{margin-top:24px;display:none}
video{width:100%;border-radius:var(--r);border:1px solid var(--border)}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.metric{display:inline-flex;align-items:center;gap:8px;background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.24);padding:8px 12px;border-radius:8px;color:#bbf7d0;font-size:13px;font-weight:600}
.warnings{display:none;margin-top:16px;padding:16px;border-radius:8px;border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.08);color:#fde68a;font-size:13px}
.warnings ul{padding-left:18px;margin-top:8px}
/* Batch */
.batch-list{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.b-item{display:flex;justify-content:space-between;padding:12px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:8px;font-size:14px}
.b-stat{color:var(--acc2)}
</style>
</head>
<body>
<div class="container">
  <div class="nav">
    <div><h1>VideoAI Studio</h1><p style="color:var(--muted)">AI-first faceless YouTube production system</p></div>
    <div id="creds" style="background:var(--border);padding:8px 16px;border-radius:99px;font-weight:600;font-size:14px">10 Credits</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('studio', this)">YouTube Studio</button>
    <button class="tab" onclick="switchTab('hybrid', this)">Hybrid Video</button>
    <button class="tab" onclick="switchTab('batch', this)">Batch Engine</button>
  </div>

  <!-- YOUTUBE STUDIO -->
  <div class="panel active" id="p-studio">
    <form onsubmit="event.preventDefault(); genStudio()" class="grid">
      <div><label>Email</label><input type="email" id="s-email" value="user@example.com" required/></div>
      <div><label>Target Duration</label><input type="number" id="s-duration" min="60" max="2400" value="720" required/></div>
      <div class="full"><label>Topic</label><textarea id="s-topic" rows="3" required placeholder="e.g. The hidden economics of AI data centers"></textarea></div>
      <div class="full"><label>Audience</label><input id="s-audience" placeholder="Curious YouTube viewers who enjoy documentary explainers"/></div>
      <div><label>Tone</label>
        <select id="s-tone">
          <option value="documentary">Documentary</option>
          <option value="educational">Educational</option>
          <option value="investigative">Investigative</option>
          <option value="conversational">Conversational</option>
        </select>
      </div>
      <div><label>Voice</label>
        <select id="s-voice">
          <option value="female_warm">Female Warm</option>
          <option value="female_professional">Female Professional</option>
          <option value="male_deep">Male Deep</option>
          <option value="female_energetic">Female Energetic</option>
        </select>
      </div>
      <div><label>Aspect Ratio</label>
        <select id="s-ratio">
          <option value="16:9">YouTube 16:9</option>
          <option value="9:16">Shorts 9:16</option>
          <option value="1:1">Square 1:1</option>
        </select>
      </div>
      <div><label>Monetization Goal</label><input id="s-money" value="long-term YouTube revenue"/></div>
      <div class="full" style="display:flex;gap:24px;flex-wrap:wrap;background:rgba(255,255,255,.02);padding:16px;border-radius:8px">
        <label class="tog"><input type="checkbox" id="s-audio" checked/> Generate Narration</label>
        <label class="tog"><input type="checkbox" id="s-images"/> Generate Planned Images</label>
        <label class="tog"><input type="checkbox" id="s-render"/> Render MP4</label>
      </div>
      <div class="full"><button type="submit" class="btn" id="s-btn">Start Production</button></div>
    </form>
  </div>

  <!-- HYBRID -->
  <div class="panel" id="p-hybrid">
    <form onsubmit="event.preventDefault(); gen('hybrid')" class="grid">
      <div class="full"><label>Email</label><input type="email" id="h-email" value="user@example.com" required/></div>
      <div class="full"><label>Topic or Prompt</label><textarea id="h-topic" rows="3" required placeholder="Detailed topic..."></textarea></div>
      <div><label>Format Preset</label>
        <select id="h-preset">
          <option value="shorts">Shorts (20-40s)</option>
          <option value="short">Short Explainer (40-90s)</option>
          <option value="medium">Medium (2-4m)</option>
          <option value="long">Long-form (6-10m)</option>
        </select>
      </div>
      <div>
        <label>Aspect Ratio</label>
        <select id="h-ratio">
          <option value="9:16">Vertical 9:16 (TikTok)</option>
          <option value="16:9">Horizontal 16:9 (YouTube)</option>
          <option value="1:1">Square 1:1</option>
        </select>
      </div>
      <div><label>AI Provider</label>
        <select id="h-ai">
          <option value="">Auto (Groq/Gemini)</option>
          <option value="groq">Groq (Fast)</option>
          <option value="gemini">Gemini</option>
        </select>
      </div>
      <div><label>Voice</label><select id="h-voice"><option value="female_warm">Female Warm (Kokoro)</option><option value="male_deep">Male Deep</option></select></div>
      <div class="full" style="display:flex;gap:24px;background:rgba(255,255,255,.02);padding:16px;border-radius:8px">
        <label class="tog"><input type="checkbox" id="h-motion" /> Use AI Motion (Layer C)</label>
        <label class="tog"><input type="checkbox" id="h-subs" checked /> Burn Subtitles</label>
        <label class="tog"><input type="checkbox" id="h-health" /> Health Awareness</label>
      </div>
      <div class="full"><button type="submit" class="btn" id="h-btn">Generate Standard Video</button></div>
    </form>
  </div>

  <!-- BATCH -->
  <div class="panel" id="p-batch">
    <form onsubmit="event.preventDefault(); genBatch()" class="grid">
      <div class="full"><label>Email</label><input type="email" id="b-email" value="user@example.com" required/></div>
      <div><label>Niche / Topic Area (Auto-discovery)</label><input type="text" id="b-niche" placeholder="e.g. AI Productivity Tools" required/></div>
      <div><label>Number of Videos</label><input type="number" id="b-count" min="1" max="50" value="5" required/></div>
      <div><label>Format Preset</label>
        <select id="b-preset"><option value="shorts">Shorts (20-40s)</option><option value="medium">Medium (2-4m)</option></select>
      </div>
      <div><label>Tone</label>
        <select id="b-tone"><option value="educational">Educational</option><option value="urgent">Urgent</option></select>
      </div>
      <div class="full"><button type="submit" class="btn" id="b-btn">Generate Batch Content</button></div>
    </form>
    
    <div id="batch-prog" class="progress">
      <h3 style="margin-bottom:8px">Batch Progress</h3>
      <div class="pbar"><div class="pfill" id="bp-fill"></div></div>
      <p id="bp-txt" style="font-size:14px;color:var(--muted)">0/0 Completed</p>
      <div class="batch-list" id="b-list"></div>
    </div>
  </div>

  <!-- Shared Progress UI -->
  <div class="progress" id="sprog">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 id="sp-stage">Starting Pipeline...</h3>
      <div style="font-size:24px;font-weight:700;color:var(--acc)" id="sp-pct">0%</div>
    </div>
    <div class="pbar"><div class="pfill" id="sp-fill"></div></div>
    <div class="eta" id="sp-msg">Initializing...</div>
    <div class="steps" id="sp-steps" style="margin-top:24px"></div>
  </div>

  <div class="result" id="result-ui">
    <h3 style="margin-bottom:16px">Generation Complete</h3>
    <div id="res-quality" class="metric" style="display:none"></div>
    <video controls id="res-vid" style="display:none;margin-top:16px"></video>
    <div class="links">
      <a id="res-dl" href="#" target="_blank" class="btn" style="display:none;text-align:center;text-decoration:none">Download Video</a>
      <a id="res-package" href="#" target="_blank" class="btn secondary" style="display:none;text-align:center;text-decoration:none">Open Package</a>
      <a id="res-audio" href="#" target="_blank" class="btn secondary" style="display:none;text-align:center;text-decoration:none">Download Audio</a>
    </div>
    <div id="res-warnings" class="warnings"></div>
  </div>
</div>

<script>
const API = 'http://localhost:9000';
let pollTimer;

const STUDIO_STEPS = [
  {id:'topic', label:'Topic Intelligence'},
  {id:'research', label:'Research'},
  {id:'story', label:'Story Architecture'},
  {id:'script', label:'Script + QA'},
  {id:'visual', label:'Visual Planning'},
  {id:'assets', label:'Assets + Images'},
  {id:'voice', label:'Voice + Audio QA'},
  {id:'packaging', label:'Titles, Thumbnail, SEO'},
  {id:'final', label:'Final QA + Render'}
];

const STD_STEPS = [
  {id:'research', label:'Researching Topic'},
  {id:'script', label:'Planning & Writing Script'},
  {id:'audio', label:'Generating Narration'},
  {id:'media', label:'Acquiring Media & Visuals'},
  {id:'motion', label:'Generating AI Motion Clips'},
  {id:'render', label:'Rendering Video & Encoding'}
];

function switchTab(t, btn){
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(e=>e.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('p-'+t)?.classList.add('active');
}

function genStudio() {
  const payload = {
    user_email: document.getElementById('s-email').value,
    topic: document.getElementById('s-topic').value,
    tone: document.getElementById('s-tone').value,
    duration: parseInt(document.getElementById('s-duration').value),
    custom_duration: parseInt(document.getElementById('s-duration').value),
    audience_profile: document.getElementById('s-audience').value,
    monetization_goal: document.getElementById('s-money').value,
    voice_id: document.getElementById('s-voice').value,
    aspect_ratio: document.getElementById('s-ratio').value,
    generate_audio: document.getElementById('s-audio').checked,
    generate_images: document.getElementById('s-images').checked,
    render_video: document.getElementById('s-render').checked
  };
  startJob('/generate/youtube-studio', payload, 'studio');
}

async function gen(type) {
  const email = document.getElementById(type[0]+'-email').value;
  const payload = {
    user_email: email,
    topic: document.getElementById(type[0]+'-topic').value,
    preset: document.getElementById(type[0]+'-preset')?.value || 'shorts',
    aspect_ratio: document.getElementById(type[0]+'-ratio')?.value,
    ai_provider: document.getElementById(type[0]+'-ai')?.value || null,
    voice_id: document.getElementById(type[0]+'-voice')?.value,
    use_ai_motion: document.getElementById(type[0]+'-motion')?.checked || false,
    subtitles: document.getElementById(type[0]+'-subs')?.checked || false,
    health_awareness: document.getElementById(type[0]+'-health')?.checked || false
  };

  startJob('/generate/'+type, payload, 'standard');
}

async function genBatch() {
  const email = document.getElementById('b-email').value;
  const payload = {
    user_email: email,
    niche: document.getElementById('b-niche').value,
    count: parseInt(document.getElementById('b-count').value),
    preset: document.getElementById('b-preset').value,
    tone: document.getElementById('b-tone').value
  };

  document.getElementById('b-btn').disabled = true;
  try {
    const r = await fetch(API+'/generate/batch', {
      method:'POST', body:JSON.stringify(payload),
      headers:{'Content-Type':'application/json'}
    });
    const d = await r.json();
    if(r.ok) pollBatch(d.batch_id);
    else alert('Error: '+d.detail);
  } catch(e) { alert(e); document.getElementById('b-btn').disabled = false; }
}

async function startJob(ep, payload, mode='standard') {
  document.getElementById('result-ui').style.display = 'none';
  const p = document.getElementById('sprog'); p.style.display='block';
  
  // init step UI
  const steps = mode === 'studio' ? STUDIO_STEPS : STD_STEPS;
  document.getElementById('sp-steps').dataset.mode = mode;
  document.getElementById('sp-steps').innerHTML = steps.map(s=>
    `<div class="step" id="st-${s.id}">• ${s.label}</div>`
  ).join('');

  try {
    const r = await fetch(API+ep, {
      method:'POST', body:JSON.stringify(payload), headers:{'Content-Type':'application/json'}
    });
    const d = await r.json();
    if(r.ok) pollJob(d.job_id, mode);
    else { alert('Error: '+d.detail); p.style.display='none'; }
  } catch (e) { alert(e); p.style.display='none'; }
}

function activeStep(status, mode) {
  if (mode !== 'studio') {
    if(status.includes('script')) return 'script';
    if(status.includes('audio')) return 'audio';
    if(status.includes('media') || status.includes('image')) return 'media';
    if(status.includes('motion')) return 'motion';
    if(status.includes('render')) return 'render';
    return 'research';
  }
  if(status.includes('topic')) return 'topic';
  if(status.includes('research')) return 'research';
  if(status.includes('story')) return 'story';
  if(status.includes('script')) return 'script';
  if(status.includes('visual')) return 'visual';
  if(status.includes('asset') || status.includes('image')) return 'assets';
  if(status.includes('voice') || status.includes('audio')) return 'voice';
  if(status.includes('packaging')) return 'packaging';
  return 'final';
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function showResult(d) {
  const result = document.getElementById('result-ui');
  const video = document.getElementById('res-vid');
  const dl = document.getElementById('res-dl');
  const pkg = document.getElementById('res-package');
  const audio = document.getElementById('res-audio');
  const quality = document.getElementById('res-quality');
  const warnings = document.getElementById('res-warnings');

  result.style.display = 'block';
  [video, dl, pkg, audio, quality, warnings].forEach(el => el.style.display = 'none');

  if(d.video_url) {
    video.src = API + d.video_url;
    video.style.display = 'block';
    dl.href = API + d.video_url;
    dl.style.display = 'block';
  }
  if(d.package_url) {
    pkg.href = API + d.package_url;
    pkg.style.display = 'block';
  }
  if(d.audio_url) {
    audio.href = API + d.audio_url;
    audio.style.display = 'block';
  }
  if(typeof d.quality_score === 'number') {
    quality.textContent = `Quality score: ${Math.round(d.quality_score)}/100`;
    quality.style.display = 'inline-flex';
  }
  if(d.warnings && d.warnings.length) {
    warnings.innerHTML = `<strong>Action items</strong><ul>${d.warnings.map(w=>`<li>${escapeHtml(w)}</li>`).join('')}</ul>`;
    warnings.style.display = 'block';
  }
}

function pollJob(jid, mode='standard') {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    const r = await fetch(`${API}/generate/jobs/${jid}`);
    const d = await r.json();
    
    document.getElementById('sp-pct').textContent = (d.progress||0)+'%';
    document.getElementById('sp-fill').style.width = (d.progress||0)+'%';
    document.getElementById('sp-stage').textContent = d.status.replace(/_/g,' ').toUpperCase();
    document.getElementById('sp-msg').textContent = d.status_detail || 'Working...';

    const steps = mode === 'studio' ? STUDIO_STEPS : STD_STEPS;
    const act = activeStep(d.status || '', mode);
    
    steps.forEach((s, idx)=>{
      const el = document.getElementById(`st-${s.id}`);
      if(!el) return;
      el.className = 'step';
      if(s.id === act) el.className = 'step active';
      else if(steps.findIndex(x=>x.id===act) > idx) el.className = 'step done';
    });

    if(d.status==='done') {
      clearInterval(pollTimer);
      document.getElementById('sprog').style.display = 'none';
      showResult(d);
    }
    if(d.status==='failed') {
      clearInterval(pollTimer); alert('Job failed: '+d.error);
      document.getElementById('sprog').style.display = 'none';
    }
  }, 2000);
}

function pollBatch(bid) {
  if(pollTimer) clearInterval(pollTimer);
  document.getElementById('batch-prog').style.display = 'block';
  const bl = document.getElementById('b-list');
  
  pollTimer = setInterval(async ()=>{
    const r = await fetch(`${API}/generate/batch/${bid}`);
    const d = await r.json();
    
    document.getElementById('bp-fill').style.width = (d.progress||0)+'%';
    document.getElementById('bp-txt').textContent = d.status_detail || 'Working...';
    
    // items must be requested separately or included in extended payload
    // for this simplified UI, we will rely on status_detail as the main indicator
    
    if(['done','partial','failed'].includes(d.status)){
      clearInterval(pollTimer);
      document.getElementById('b-btn').disabled = false;
      alert('Batch Complete. Check output directory for files.');
    }
  }, 2500);
}
</script>
</body>
</html>
